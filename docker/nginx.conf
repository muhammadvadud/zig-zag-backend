# Example reverse-proxy config for production deployment.
# Put this in front of Gunicorn and terminate TLS here (or at Cloudflare).

upstream zigzag_app {
    server web:8000;
}

server {
    listen 80;
    server_name api.zigzag.uz;

    client_max_body_size 10M;

    # Coarse per-IP rate limiting (the app adds fine-grained throttles).
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://zigzag_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
