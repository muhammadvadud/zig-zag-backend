services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zigzag}
      POSTGRES_USER: ${POSTGRES_USER:-zigzag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zigzag}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zigzag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build: .
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    env_file: .env
    command: celery -A config worker -l info
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  beat:
    build: .
    env_file: .env
    command: celery -A config beat -l info
    depends_on:
      - db
      - redis

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
